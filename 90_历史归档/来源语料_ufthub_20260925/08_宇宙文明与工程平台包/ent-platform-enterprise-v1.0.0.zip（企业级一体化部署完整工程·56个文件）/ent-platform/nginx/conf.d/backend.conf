# =============================================================================
# 业务站点配置 —— 对外统一入口
#   /            -> 静态资源目录
#   /api/        -> Java 后端 (反向代理 + 长连接)
# OCR/浏览器/数据库均不对外暴露, 只在 core 网络内互通
# HTTPS 模板见文件末尾注释
# =============================================================================
server {
    listen       80;
    server_name  _;

    charset utf-8;
    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # ---------- 静态资源 ----------
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        access_log off;
    }

    # ---------- Java 后端 ----------
    # Docker 内置 DNS 惰性解析: backend 未启用时 nginx 也能正常启动,
    # backend 上线/扩容后 30s 内自动感知并轮询
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        resolver 127.0.0.11 ipv6=off valid=30s;
        set $backend_addr "backend:8080";
        rewrite ^/api/(.*)$ /$1 break;     # 去掉 /api 前缀再转发
        proxy_pass http://$backend_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------- 健康检查 (给负载均衡/监控用) ----------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- HTTPS 模板 (证书放到 nginx/certs 后取消注释并在 compose 暴露443)
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/server.crt;
    # ssl_certificate_key /etc/nginx/certs/server.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # HTTP 跳转 HTTPS:
    # if ($scheme = http) { return 301 https://$host$request_uri; }
}
