<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROOT V56 | 3D 地球统一力场实验室</title><style>body{margin:0;background:#07111f;color:#e6f0ff;font:14px system-ui}header{padding:15px 22px;border-bottom:1px solid #29415b}h1{font-size:21px;margin:0}small{color:#a3b8d2}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(100vh - 65px)}canvas{width:100%;height:100%;touch-action:none;cursor:grab}aside{padding:18px;background:#0d2033;overflow:auto}label{display:block;margin:13px 0 4px;color:#c1d6eb}input,select{width:100%;box-sizing:border-box;background:#142c45;color:white;border:1px solid #47617c;padding:7px;border-radius:5px}input[type=checkbox]{width:auto}output,pre{display:block;white-space:pre-wrap;word-break:break-word;background:#071828;border:1px solid #2d4560;padding:10px;border-radius:7px;line-height:1.55}.legend{padding:9px;background:#0a2032;color:#bad0e8}button{background:#1c7ea4;color:white;border:0;border-radius:6px;padding:9px;cursor:pointer}@media(max-width:780px){.layout{grid-template-columns:1fr;height:auto}canvas{height:55vh}aside{max-height:none}}</style><header><h1>ROOT V56 · 三维地球统一力场实验室</h1><small>离线运行 · 交互式三维投影 · 球形地球 + J₂ 重力 + 理想磁偶极 · 非实时观测数据</small></header><div class="layout"><div style="min-width:0;position:relative"><canvas id="view"></canvas><div class="legend">拖动旋转地球 · 滚轮缩放 · 箭头为方向示意，长度经过归一化（非真实力值比例）<br><span style="color:#ffa54b">● 引力</span>　<span style="color:#55e2cc">● 磁场</span>　<span style="color:#bd98ff">● 测试电场</span></div></div><aside><b>位置与场查询</b><label>纬度 (°)</label><input id="lat" type="range" min="-90" max="90" value="35"><label>经度 (°)</label><input id="lon" type="range" min="-180" max="180" value="110"><label>高度 (km)</label><input id="alt" type="range" min="0" max="2000" value="400"><label>场显示</label><select id="mode"><option value="all">引力 + 磁场 + 电场</option><option value="g">仅引力</option><option value="b">仅磁场</option><option value="e">仅电场</option></select><label>合成测试电场 E₀ (V/m)</label><input id="E0" type="number" value="0" step="1"><label>测试质量 (kg)</label><input id="mass" type="number" value="1" step="0.1"><label>测试电荷 (C)</label><input id="charge" type="number" value="0" step="0.001"><label>速度分量 ECEF (m/s)，逗号分隔</label><input id="vel" value="0,100,0"><p><button id="reset">复位视角</button></p><output id="results"></output><small>注意：电场是用户设定的径向测试场，不是全球实测大气电场。磁场模型不含磁轴倾斜、地壳场和磁暴。力的数值必须指定测试粒子的质量、电荷和速度。</small></aside></div><script>
const R=6371000,GM=6.67430e-11*5.9722e24,J2=1.08262668e-3,W=7.292115e-5,BE=3.12e-5;const $=id=>document.getElementById(id);const cv=$('view'),ctx=cv.getContext('2d');let yaw=.5,pitch=.35,zoom=1,drag=null;
const add=(a,b)=>a.map((x,i)=>x+b[i]),scale=(a,k)=>a.map(x=>x*k),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),mag=a=>Math.hypot(...a),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function point(lat,lon,r=1){let a=lat*Math.PI/180,b=lon*Math.PI/180;return [r*Math.cos(a)*Math.cos(b),r*Math.cos(a)*Math.sin(b),r*Math.sin(a)]}
function field(p){let r=mag(p),z=p[2],k=-GM/(r*r*r),f=1.5*J2*(R/r)**2,u=5*z*z/(r*r);let g=[k*p[0]*(1-f*(u-1)),k*p[1]*(1-f*(u-1)),k*p[2]*(1-f*(u-3))];let n=scale(p,1/r),b=scale(add(scale(n,3*n[2]),[0,0,-1]),BE*(R/r)**3);let e=scale(p,(Number($('E0').value)||0)*R*R/r**3);return {g,b,e}}
function project(p){let c=Math.cos(yaw),s=Math.sin(yaw),a=p[0]*c-p[1]*s,b=p[0]*s+p[1]*c,cp=Math.cos(pitch),sp=Math.sin(pitch);return [a,b*sp+p[2]*cp,b*cp-p[2]*sp]}
function pix(p){let v=project(p),d=Math.min(cv.clientWidth,cv.clientHeight)*.34*zoom;return [cv.width/2+v[0]*d,cv.height/2-v[1]*d,v[2]]}
function line(a,b,color,width=1.5){let x=pix(a),y=pix(b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x[0],x[1]);ctx.lineTo(y[0],y[1]);ctx.stroke()}
function arrow(p,v,color){let len=mag(v);if(!len)return;let end=add(p,scale(v,.2/len)),a=pix(p),b=pix(end);if(pix(p)[2]<-.06)return;line(p,end,color,2);let ang=Math.atan2(b[1]-a[1],b[0]-a[0]);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-9*Math.cos(ang-.45),b[1]-9*Math.sin(ang-.45));ctx.lineTo(b[0]-9*Math.cos(ang+.45),b[1]-9*Math.sin(ang+.45));ctx.fill()}
function draw(){let dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#07111f';ctx.fillRect(0,0,cv.width,cv.height);
// Draw solid globe as a shaded projected disk, then latitude/longitude wires (back lines occluded).
let center=pix([0,0,0]),rad=Math.min(w,h)*.34*zoom*dpr;let gr=ctx.createRadialGradient(center[0]-rad*.3,center[1]-rad*.4,rad*.04,center[0],center[1],rad);gr.addColorStop(0,'#2b87ba');gr.addColorStop(.7,'#16486e');gr.addColorStop(1,'#081f3d');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(center[0],center[1],rad,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3b789b';ctx.stroke();
for(let lat=-75;lat<=75;lat+=15)for(let lon=-180;lon<180;lon+=3){let a=point(lat,lon),b=point(lat,lon+3);if(pix(a)[2]>0&&pix(b)[2]>0)line(a,b,'#4d94b766',.65)}for(let lon=-180;lon<180;lon+=15)for(let lat=-90;lat<90;lat+=3){let a=point(lat,lon),b=point(lat+3,lon);if(pix(a)[2]>0&&pix(b)[2]>0)line(a,b,'#4d94b766',.65)}
let mode=$('mode').value;for(let lat=-75;lat<=75;lat+=30)for(let lon=-180;lon<180;lon+=30){let u=point(lat,lon,1.11),p=scale(u,R),f=field(p);if(mode==='all'||mode==='g')arrow(u,f.g,'#ffa54b');if(mode==='all'||mode==='b')arrow(u,f.b,'#55e2cc');if((mode==='all'||mode==='e')&&mag(f.e)>0)arrow(u,f.e,'#bd98ff')}
let lat=+$('lat').value,lon=+$('lon').value,alt=+$('alt').value;let pos=point(lat,lon,1+alt*1000/R);let xy=pix(pos);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(xy[0],xy[1],5*dpr,0,Math.PI*2);ctx.fill();ctx.font=`${12*dpr}px system-ui`;ctx.fillText('查询点',xy[0]+8*dpr,xy[1]-8*dpr);
let v=$('vel').value.split(',').map(Number);if(v.length!==3||v.some(x=>!Number.isFinite(x)))v=[0,0,0];let f=field(scale(pos,R)),m=+$('mass').value||0,q=+$('charge').value||0,fg=scale(f.g,m),fe=scale(f.e,q),fb=scale(cross(v,f.b),q),ft=add(add(fg,fe),fb);const fmt=(a,n=5)=>a.map(x=>x.toExponential(n)).join(', ');$('results').textContent=`坐标: 纬度 ${lat}°, 经度 ${lon}°, 高度 ${alt} km\n|g| = ${mag(f.g).toFixed(7)} m/s²\n|B| = ${(mag(f.b)*1e6).toFixed(4)} μT\n|E| = ${mag(f.e).toFixed(4)} V/m\n引力矢量 (m/s²):\n${fmt(f.g)}\n磁场矢量 (T):\n${fmt(f.b)}\n电场矢量 (V/m):\n${fmt(f.e)}\n引力 (N): ${fmt(fg)}\n电场力 (N): ${fmt(fe)}\n磁场力 (N): ${fmt(fb)}\n合力 (N): ${fmt(ft)}\n合力大小 = ${mag(ft).toExponential(6)} N\nF磁 · v = ${dot(fb,v).toExponential(3)} W`}
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()});cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2,zoom*(e.deltaY>0?.92:1.08)));draw()},{passive:false});document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',draw));$('reset').onclick=()=>{yaw=.5;pitch=.35;zoom=1;draw()};addEventListener('resize',draw);draw();
</script></html>
