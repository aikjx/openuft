<!DOCTYPE html>
<html lang="zh" style="margin:0;padding:0;">
<head><meta charset="utf-8">
<title>TUFT V3.2 三维参数稳定相区（V1×V2×M2）</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Microsoft YaHei,sans-serif;background:#fff}
.c{width:98%;max-width:1180px;margin:12px auto}.t{font-size:15px;font-weight:600;margin:6px 2px 2px}
.s{font-size:11px;color:#666;margin:0 2px 6px}.pan{width:100%;height:300px;margin-bottom:6px}
.note{font-size:11px;color:#555;line-height:1.5;margin:6px 2px 14px;border-left:3px solid #ddd;padding-left:8px}</style>
</head><body>
<div class="c"><div class="t">三维参数稳定相区 S=min(E₀/Q)/m（V1 分层）</div>
<div class="s">横轴 M2、纵轴 V2 · 绿=S&lt;1 STABLE、红=S&gt;1 decay、灰=无Q-ball(V1²≤4M2V2) · 数据：V3.2_paramscan3d.json · 粗扫 5ω/点，S 为下界估计</div></div>
<div class="c" id="p0"></div>
<div class="c" id="p1"></div>
<div class="c" id="p2"></div>
<div class="c"><div class="note">M2=0.2 层全 V1 不可稳定；稳定需 M2≥0.4；随 V1 增大稳定带向高 V2 漂移。边界点(V1=1.2,V2=0.8,M2=0.4)S≈0.99-1.01 摇摆（离散化敏感）。红线：L3=0、示范参数非粒子身份。</div></div>
<script>
var layers=[
 {V1:'1.0',pts:[[0.2,0.2,1.2564],[0.2,0.4,1.1859],[0.2,0.6,1.0190],[0.2,0.8,1.0490],[0.4,0.2,1.1273],[0.4,0.4,0.9079],[0.4,0.6,0.9681],[0.6,0.2,0.8918],[0.6,0.4,0.9731]]},
 {V1:'1.2',pts:[[0.2,0.2,1.2773],[0.2,0.4,1.2303],[0.2,0.6,1.1719],[0.2,0.8,1.0574],[0.4,0.2,1.1559],[0.4,0.4,0.9813],[0.4,0.6,0.8903],[0.4,0.8,0.9861],[0.6,0.2,1.1308],[0.6,0.4,0.8943]]},
 {V1:'1.4',pts:[[0.2,0.2,1.2902],[0.2,0.4,1.2550],[0.2,0.6,1.2209],[0.2,0.8,1.1790],[0.4,0.2,1.1741],[0.4,0.4,1.1254],[0.4,0.6,0.9152],[0.4,0.8,0.8993],[0.6,0.2,1.2133],[0.6,0.4,0.9144],[0.6,0.6,0.8572],[0.6,0.8,0.9696]]}];
var invalid=[[0.4,0.8],[0.6,0.6],[0.6,0.8],[0.6,1.0]];
function mk(dom,lay){
 var ch=echarts.init(document.getElementById(dom));
 ch.setOption({
  title:{text:'V1='+lay.V1,textStyle:{fontSize:12},left:6,top:4},
  tooltip:{trigger:'item',triggerOn:'mousemove|click',renderMode:'richText',confine:true,
    formatter:function(p){if(p.seriesIndex===1)return 'M2='+p.value[0]+'  V2='+p.value[1]+'  无Q-ball';return 'M2='+p.value[0]+'  V2='+p.value[1]+'  S='+p.value[2].toFixed(3)+(p.value[2]<1?'  STABLE':'  decay');}},
  grid:{left:46,right:16,top:26,bottom:34,containLabel:true},
  xAxis:{type:'value',name:'M2',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10},min:0.15,max:0.65},
  yAxis:{type:'value',name:'V2',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10},min:0.15,max:0.85},
  visualMap:{min:0.78,max:1.3,orient:'vertical',right:0,top:8,textStyle:{fontSize:9},
    inRange:{color:['#2f9e44','#f4f4f4','#e03131']}},
  series:[
   {name:'S',type:'scatter',data:lay.pts.map(function(d){return [d[0],d[1],d[2]]}),
     symbolSize:function(v){return 15+20*(Math.abs(v[2]-1));},
     label:{show:true,formatter:function(p){return p.value[2].toFixed(2);},fontSize:9,color:'#000'}},
   {name:'无Q-ball',type:'scatter',data:invalid.map(function(d){return [d[0],d[1]]}),
     symbol:'rect',symbolSize:11,itemStyle:{color:'#ccc'},label:{show:true,formatter:'✕',fontSize:10,color:'#888'}}
  ]});
 return ch;
}
var chs=[mk('p0',layers[0]),mk('p1',layers[1]),mk('p2',layers[2])];
window.addEventListener('resize',function(){chs.forEach(function(c){c.resize();});});
</script>
</body></html>
