<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="120" fill="white"/>
  <!-- 公式：P = mc(Ĉ - V/c) -->
  <text x="200" y="60" font-family="Times New Roman, serif" font-size="24" text-anchor="middle" fill="black">
    <tspan font-weight="bold">P</tspan> = mc(<tspan font-style="italic">Ĉ</tspan> - 
    <tspan font-style="italic">V</tspan>/c)
  </text>
  <!-- 标签 -->
  <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="gray">动量定义公式</text>
</svg>