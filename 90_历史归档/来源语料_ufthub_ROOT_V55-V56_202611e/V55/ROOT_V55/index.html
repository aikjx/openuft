<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROOT V55 地球统一力场实验室</title><style>body{margin:0;background:#0b1324;color:#e5eaf5;font:15px system-ui}header{padding:18px 24px;background:#142039}main{display:grid;grid-template-columns:minmax(290px,330px) 1fr;gap:14px;padding:14px}aside,section{background:#142039;border-radius:12px;padding:16px}label{display:block;margin:12px 0}input,select{width:100%;box-sizing:border-box;background:#233451;color:white;border:1px solid #4c6386;border-radius:5px;padding:8px}canvas{width:100%;max-height:70vh;background:#09111e;border-radius:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#9eb4d6}@media(max-width:720px){main{grid-template-columns:1fr}}</style><header><h2>ROOT V55 · 地球引力 / 电场 / 磁场 / 合力</h2><small>地球外部球对称引力 + 轴向磁偶极 + 用户设定的均匀电场。二维赤道-极轴截面，教学与研究原型。</small></header><main><aside><label>显示场<select id="mode"><option value="g">引力加速度 g</option><option value="B">磁感应强度 B</option><option value="E">电场 E</option><option value="F">测试粒子合力 F</option></select></label><label>测试粒子质量 (kg)<input id="mass" type="number" value="1" step="any"></label><label>测试电荷 (C)<input id="charge" type="number" value="0.000001" step="any"></label><label>速度 vy (m/s)<input id="vy" type="number" value="1000" step="any"></label><label>均匀电场 Ez (N/C)<input id="ez" type="number" value="100" step="any"></label><label>采样位置 x / 地球半径<input id="xp" type="number" value="1.5" min="-4" max="4" step=".1"></label><label>采样位置 z / 地球半径<input id="zp" type="number" value="0.5" min="-4" max="4" step=".1"></label><pre id="info"></pre><small>提示：磁力方向与速度垂直；地球真实电场、地磁非均匀性、旋转、潮汐、强弱核力均未纳入。点击画布可选位置。</small></aside><section><canvas id="canvas" width="850" height="700"></canvas><p id="legend"></p></section></main><script>
const G=6.67430e-11,M=5.9722e24,R=6.371e6,B0=3.12e-5,canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);const val=id=>Number($(id).value);function calc(x,z){let r=Math.hypot(x,z);if(r<1)return null;let nx=x/r,nz=z/r,gg=-G*M/(R*R*r*r),g=[gg*nx,gg*nz];let factor=B0/(r*r*r);let b=[factor*3*nz*nx,factor*(3*nz*nz-1)];let e=[0,val('ez')];let m=val('mass'),q=val('charge'),v=val('vy');let fg=g.map(a=>a*m),fe=e.map(a=>a*q);let fb=[q*v*b[1],-q*v*b[0]];let f=[fg[0]+fe[0]+fb[0],fg[1]+fe[1]+fb[1]];return {g,B:b,E:e,F:f,fg,fe,fb};}
function arrow(x,y,dx,dy,color){let n=Math.hypot(dx,dy);if(n<1e-25)return;dx/=n;dy/=n;let L=18;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(x-dx*L*.5,y-dy*L*.5);ctx.lineTo(x+dx*L*.5,y+dy*L*.5);ctx.stroke();ctx.beginPath();ctx.moveTo(x+dx*L*.5,y+dy*L*.5);ctx.lineTo(x+dx*L*.5-dx*6-dy*4,y+dy*L*.5-dy*6+dx*4);ctx.lineTo(x+dx*L*.5-dx*6+dy*4,y+dy*L*.5-dy*6-dx*4);ctx.fill();}
function draw(){let W=canvas.width,H=canvas.height,scale=H/8,cx=W/2,cy=H/2,mode=$('mode').value;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#233954';for(let k=-4;k<=4;k++){ctx.beginPath();ctx.moveTo(cx+k*scale,0);ctx.lineTo(cx+k*scale,H);ctx.moveTo(0,cy+k*scale);ctx.lineTo(W,cy+k*scale);ctx.stroke()}ctx.fillStyle='#214a77';ctx.beginPath();ctx.arc(cx,cy,scale,0,2*Math.PI);ctx.fill();ctx.strokeStyle='#70b5ed';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#c5e3ff';ctx.fillText('地球（球形模型）',cx-55,cy+4);for(let x=-3.8;x<=3.8;x+=.38)for(let z=-3.8;z<=3.8;z+=.38){let f=calc(x,z);if(!f)continue;let vec=f[mode];arrow(cx+x*scale,cy-z*scale,vec[0],-vec[1],{g:'#7bd3ff',B:'#e7a8ff',E:'#f5c86d',F:'#78e5ac'}[mode]);}let x=val('xp'),z=val('zp'),f=calc(x,z);ctx.fillStyle='#ff7777';ctx.beginPath();ctx.arc(cx+x*scale,cy-z*scale,6,0,2*Math.PI);ctx.fill();if(f){let n=v=>Math.hypot(...v);$('info').textContent=`位置：(${x.toFixed(2)}, 0, ${z.toFixed(2)}) R⊕\n|g| = ${n(f.g).toExponential(6)} m/s²\n|E| = ${n(f.E).toExponential(6)} N/C\n|B| = ${n(f.B).toExponential(6)} T\nFg = ${JSON.stringify(f.fg)} N\nFe = ${JSON.stringify(f.fe)} N\nFb = ${JSON.stringify(f.fb)} N\nF合 = ${JSON.stringify(f.F)} N\n|F合| = ${n(f.F).toExponential(6)} N`;}else $('info').textContent='采样点位于地球内部：本模型不适用。';$('legend').textContent='箭头显示方向，统一固定长度；不代表强度。数值请查看左侧采样点。';}
canvas.addEventListener('click',ev=>{let b=canvas.getBoundingClientRect();let px=(ev.clientX-b.left)*canvas.width/b.width,py=(ev.clientY-b.top)*canvas.height/b.height;$('xp').value=((px-canvas.width/2)/(canvas.height/8)).toFixed(2);$('zp').value=((canvas.height/2-py)/(canvas.height/8)).toFixed(2);draw()});document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',draw));draw();
</script></html>
