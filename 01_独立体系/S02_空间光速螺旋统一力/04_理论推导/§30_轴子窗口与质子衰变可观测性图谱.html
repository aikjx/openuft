<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>§30 轴子窗口与质子衰变可观测性：PQ 两路径判定</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #chart { width: 986px; height: 420px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
(function(){
  var el = document.getElementById('chart');
  if (!el || typeof echarts === 'undefined') { return; }
  var chart = echarts.init(el);
  var opt = {
    title: { text: '§30 PQ 两路径判定：DFSZ-KN 不可检验 vs KSVZ-SU(5) dim-6 可观测窄带', left: 'center', top: 6, textStyle: { fontSize: 15 } },
    tooltip: {
      trigger: 'axis', triggerOn: 'mousemove|click', renderMode: 'richText', confine: true,
      formatter: function(ps){
        if (!ps || !ps.length) { return ''; }
        var p = ps[0];
        var v = p.value;
        var e = Math.floor(Math.log10(v[1]));
        return 'M_X = ' + v[0].toExponential(1) + ' GeV' + String.fromCharCode(10)
             + 'τ = ' + (v[1]/Math.pow(10,e)).toFixed(2) + '×10' + e + ' yr';
      }
    },
    legend: { top: 30, textStyle: { fontSize: 11 } },
    grid: { left: 100, right: 50, top: 72, bottom: 55, containLabel: true },
    xAxis: { type: 'value', name: 'M_X (10¹⁵ GeV)', min: 3.5, max: 7.5,
      axisLabel: { fontSize: 11, formatter: function(v){ return v.toFixed(1); } }, nameTextStyle: { fontSize: 11 } },
    yAxis: { type: 'log', name: 'τ (yr)', min: 1e33, max: 1e37,
      axisLabel: { fontSize: 11, formatter: function(v){ var e = Math.floor(Math.log10(v)); return (v/Math.pow(10,e)).toFixed(1) + 'e' + e; } },
      nameTextStyle: { fontSize: 11 } },
    series: [
      {
        name: 'τ₆(M_X) dim-6（M2: KSVZ-SU(5)）', type: 'line', symbol: 'circle', symbolSize: 6, lineStyle: { width: 2 },
        data: (function(){
          var d = [];
          for (var i = 0; i <= 40; i++) { var x = 3.5 + i*0.1; d.push([x, 5e34*Math.pow(x/8, 4)]); }
          return d;
        })(),
        markLine: {
          symbol: 'none', silent: true, lineStyle: { type: 'dashed', width: 1.5 }, label: { fontSize: 11 },
          data: [
            { yAxis: 2.4e34, label: { formatter: 'Super-K π⁰e⁺ 界 2.4×10³⁴', position: 'insideEndTop' } },
            { yAxis: 1e35, lineStyle: { type: 'dotted' }, label: { formatter: 'Hyper-K ~10³⁵', position: 'insideEndTop' } }
          ]
        },
        markArea: {
          silent: true, itemStyle: { color: 'rgba(120,180,255,0.20)' },
          data: [[{ xAxis: 6.66, yAxis: 2.4e34 }, { xAxis: 7.0, yAxis: 1e35 }]]
        }
      },
      {
        name: 'M1: DFSZ-KN 不可检验区', type: 'line', symbol: 'none', lineStyle: { type: 'dotted', width: 1.5 },
        data: [[3.5, 1e37], [7.5, 1e37]]
      },
      {
        name: '文献范围 M_GUT∈(4,7)e15', type: 'scatter', symbol: 'diamond', symbolSize: 8,
        data: [[7.0, 2.93e34], [4.0, 3.12e33], [5.7, 1.29e34]]
      }
    ]
  };
  chart.setOption(opt);
  window.addEventListener('resize', function(){ if (chart) { chart.resize(); } });
})();
</script>
</body>
</html>
