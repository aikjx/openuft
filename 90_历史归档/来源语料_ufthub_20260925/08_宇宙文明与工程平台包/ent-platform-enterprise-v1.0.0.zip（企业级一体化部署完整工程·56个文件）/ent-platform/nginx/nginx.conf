# =============================================================================
# Nginx 主配置 (容器内 /etc/nginx/nginx.conf)
# 调优点: worker 按 CPU 自适配、epoll、gzip、统一日志格式、防慢连接
# =============================================================================
user  nginx;
worker_processes  auto;                 # 容器可见 CPU 数自动匹配
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    use epoll;
    worker_connections 10240;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------- 日志格式(带上游耗时, 排障关键) ----------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'u_rt=$upstream_response_time u_addr=$upstream_addr';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    server_tokens off;                    # 隐藏版本号(安全)
    client_header_timeout 30s;
    client_body_timeout   60s;
    send_timeout          60s;

    # ---------- 请求体: 截图/文件上传 ----------
    client_max_body_size 50m;
    client_body_buffer_size 128k;

    # ---------- gzip ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_vary on;

    # ---------- 上游 Java 后端 ----------
    # 不写静态 upstream: backend 是可选 profile(无 app.jar 时不启用),
    # 静态 upstream 会在 nginx 启动时强解析主机名导致 nginx 起不来。
    # 改为在 conf.d/backend.conf 中用 resolver 127.0.0.11(Docker DNS) 惰性解析,
    # 同时获得 30s 自动重新解析与多副本轮询能力。

    # 限流: 每 IP 10r/s, burst 20 (按需调整/关闭)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}
