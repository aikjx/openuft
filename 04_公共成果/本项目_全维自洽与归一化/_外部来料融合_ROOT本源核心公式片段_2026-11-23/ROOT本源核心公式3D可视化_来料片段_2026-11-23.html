<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四力统一·ROOT本源核心公式 3D可视化</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
<style>
  :root {
    --bg: #020408;
    --bg2: #060c14;
    --panel: rgba(6,14,28,0.92);
    --gold: #f5c842;
    --gold2: #e8a020;
    --cyan: #00e5ff;
    --cyan2: #0097b2;
    --green: #00ff9d;
    --green2: #00c47a;
    --red: #ff4060;
    --red2: #cc2040;
    --purple: #bf80ff;
    --purple2: #8040cc;
    --orange: #ff8c00;
    --white: #e8f0ff;
    --muted: #7090b8;
    --border: rgba(0,180,255,0.18);
    --glow-cyan: 0 0 24px rgba(0,229,255,0.35), 0 0 60px rgba(0,140,200,0.18);
    --glow-gold: 0 0 20px rgba(245,200,66,0.4), 0 0 50px rgba(200,140,20,0.2);
    --glow-green: 0 0 20px rgba(0,255,157,0.35), 0 0 50px rgba(0,180,100,0.18);
    --glow-red: 0 0 20px rgba(255,64,96,0.35), 0 0 50px rgba(200,30,60,0.18);
    --glow-purple: 0 0 20px rgba(191,128,255,0.35), 0 0 50px rgba(130,60,200,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Courier New', monospace;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Starfield background */
  #starfield {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 50% 30%, #0a1a30 0%, #020408 70%);
  }

  .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--t) ease-in-out infinite var(--d); }
  @keyframes twinkle { 0%,100%{opacity:var(--o);transform:scale(1)} 50%{opacity:0.1;transform:scale(0.5)} }

  /* Layout */
  .wrapper { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 24px 80px; }

  /* Header */
  .header {
    text-align: center;
    padding: 48px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 20%; right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), var(--cyan), transparent);
    box-shadow: var(--glow-cyan);
  }
  .header-badge {
    display: inline-block;
    font-size: 11px; letter-spacing: 0.2em;
    color: var(--cyan); border: 1px solid var(--cyan2);
    padding: 4px 16px; border-radius: 20px;
    margin-bottom: 16px;
    text-transform: uppercase;
    box-shadow: var(--glow-cyan);
  }
  .header h1 {
    font-size: clamp(22px, 3.5vw, 38px);
    font-family: 'Courier New', monospace;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.04em;
    line-height: 1.3;
    text-shadow: 0 0 30px rgba(0,200,255,0.5);
    margin-bottom: 10px;
  }
  .header h1 span { color: var(--gold); }
