name: Test Framework

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install mpmath numpy matplotlib
      - name: Run core verification
        run: python code/verify_core.py
      - name: Run alpha ratio analysis
        run: python code/alpha_ratio.py
