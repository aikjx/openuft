<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ROOT V94｜作用量与螺旋闭环实验室</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e4ebf9;background:#0b1222}*{box-sizing:border-box}body{margin:0}header{padding:26px 28px 14px;max-width:1300px;margin:auto}h1{font-size:25px;margin:0 0 10px}p{line-height:1.55;color:#acbdd5;max-width:950px;margin:5px 0}main{max-width:1300px;margin:0 auto;padding:12px 24px 36px;display:grid;grid-template-columns:310px minmax(380px,1fr);gap:16px}.pane{background:#131e34;border:1px solid #2d3953;border-radius:13px;padding:18px}.field{margin:17px 0}label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:9px}input[type=range]{width:100%;accent-color:#76bbf8}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{border:1px solid #33405b;border-radius:10px;padding:13px}.val{display:block;font-size:22px;font-weight:700;color:#eef8ff}.cap{font-size:12px;color:#a6b9d2}button{background:#2a5984;color:white;border:0;border-radius:9px;padding:10px 15px;cursor:pointer;margin-top:10px}canvas{width:100%;height:auto;background:radial-gradient(circle at 60% 30%,#1a3454,#0d1526);border-radius:12px}.warn{margin-top:18px;padding:13px;border-left:3px solid #c7a26f;background:#1d2635;line-height:1.5;font-size:13px;color:#e6d3b9}.legend{font-size:13px;color:#bbcee7;margin-top:8px}@media(max-width:850px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>ROOT V94｜从作用量到空间螺旋闭环</h1><p>内外环面结 • 逆 Maxwell–Lorentz 驱动 • 局部场强与稳定性审计。此处为 <strong>THEORY / 数值演示</strong>，不是实验观测或四力统一证明。</p></header><main><section class="pane"><h3>几何与速度参数</h3><div class="field"><label for="major">主半径 R <output id="majorOut"></output></label><input id="major" type="range" min="6" max="24" step="1" value="10"></div><div class="field"><label for="minor">截面半径 a <output id="minorOut"></output></label><input id="minor" type="range" min="1" max="5" step=".5" value="2"></div><div class="field"><label for="m">主绕行数 m <output id="mOut"></output></label><input id="m" type="range" min="1" max="5" step="1" value="2"></div><div class="field"><label for="n">内外往复数 n <output id="nOut"></output></label><input id="n" type="range" min="1" max="7" step="1" value="3"></div><div class="field"><label for="beta">真实粒子 β=v/c <output id="betaOut"></output></label><input id="beta" type="range" min=".1" max=".95" step=".05" value=".8"></div><div class="field"><label for="phase">粒子位置 u <output id="phaseOut"></output></label><input id="phase" type="range" min="0" max="6.283185307179586" step=".02" value="1.1"></div><button id="play">暂停动画</button> <button id="reset">重置参数</button><div class="warn">图中曲线是预先设定的三维空间轨迹。驱动磁场由目标加速度反求；无法仅由该图证明粒子自然形成环面结，或证明引力、电磁、强弱相互作用统一。</div></section><section class="pane"><canvas id="scene" width="890" height="535" aria-label="环面闭合粒子轨迹及局部磁场方向"></canvas><p class="legend">蓝色轨迹：指定环面螺旋的投影；亮点：当前粒子位置；金色箭头：逆向磁场局部方向（无量纲归一显示）</p><div class="metrics"><div class="metric"><span class="cap">闭合路径长度</span><span class="val" id="length">—</span></div><div class="metric"><span class="cap">单圈运行时间</span><span class="val" id="period">—</span></div><div class="metric"><span class="cap">当前曲率 κ</span><span class="val" id="curvature">—</span></div><div class="metric"><span class="cap">最小范数逆磁场 |B|</span><span class="val" id="magnetic">—</span></div><div class="metric"><span class="cap">路径是否空间闭合</span><span class="val" id="closed">—</span></div><div class="metric"><span class="cap">基本 G 是否被独立推出</span><span class="val">否</span></div></div></section></main><script>
const c=299792458, me=9.1093837139e-31, q=1.602176634e-19, tau=Math.PI*2;
const ids=['major','minor','m','n','beta','phase'];let running=true,raf;
const el=id=>document.getElementById(id);let $=x=>Number(el(x).value);
function curve(u,R,a,m,n){let rho=R+a*Math.cos(n*u),cr=Math.cos(m*u),sr=Math.sin(m*u);return [rho*cr,rho*sr,a*Math.sin(n*u)]}
function basis(u,R,a,m,n){let rho=R+a*Math.cos(n*u),rp=-a*n*Math.sin(n*u),rpp=-a*n*n*Math.cos(n*u),zp=a*n*Math.cos(n*u),zpp=-a*n*n*Math.sin(n*u),cs=Math.cos(m*u),sn=Math.sin(m*u);let p=[rp*cs-m*rho*sn,rp*sn+m*rho*cs,zp],b=[(rpp-m*m*rho)*cs-2*m*rp*sn,(rpp-m*m*rho)*sn+2*m*rp*cs,zpp];return [p,b]}
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0), cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>Math.sqrt(dot(a,a));
function info(u,R,a,m,n,beta){let [p,b]=basis(u,R,a,m,n),s=norm(p),v=beta*c,g=1/Math.sqrt(1-beta*beta),pv=p.map(x=>v*x/s),w=dot(p,b),acc=b.map((x,i)=>v*v*(x/s**2-p[i]*w/s**4)),B=cross(acc,pv).map(x=>g*me*x/(-q*v*v));return{r:curve(u,R,a,m,n),s,k:norm(cross(p,b))/s**3,B,kB:norm(B)}}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function project(v){return[445+18000*(v[0]*.85+v[1]*.36),260+18000*(-.24*v[0]+.54*v[1]-v[2]*.9)]}
function arrow(ctx,src,vec,scale){let [x,y]=project(src),to=project(src.map((t,i)=>t+vec[i]*scale)),dx=to[0]-x,dy=to[1]-y,n=Math.hypot(dx,dy);if(n<1)return;let ux=dx/n,uy=dy/n;ctx.strokeStyle='#f3bb63';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(...to);ctx.stroke();ctx.beginPath();ctx.moveTo(to[0],to[1]);ctx.lineTo(to[0]-11*ux-5*uy,to[1]-11*uy+5*ux);ctx.lineTo(to[0]-11*ux+5*uy,to[1]-11*uy-5*ux);ctx.fillStyle='#f3bb63';ctx.fill()}
function render(){let R=$('major')/1000,a=$('minor')/1000,m=$('m'),n=$('n'),beta=$('beta'),u=$('phase'),N=800,g=gcd(m,n),end=tau/g;for(let id of ids)el(id+'Out').textContent=(id==='major'||id==='minor')?$(id).toFixed(1)+' mm':id==='beta'?beta.toFixed(2):id==='phase'?u.toFixed(2)+' rad':$(id).toFixed(0);
const ctx=el('scene').getContext('2d');ctx.clearRect(0,0,890,535);ctx.lineWidth=2.3;ctx.strokeStyle='#73bbf8';ctx.beginPath();let length=0,prev;
for(let i=0;i<=N;i++){let t=end*i/N,z=curve(t,R,a,m,n),pt=project(z);if(i===0)ctx.moveTo(...pt);else ctx.lineTo(...pt);prev=z;}ctx.stroke();
const h=end/N;const sigma=(t)=>Math.sqrt((a*n)**2+(m*(R+a*Math.cos(n*t)))**2);let sum=sigma(0)+sigma(end);for(let i=1;i<N;i++)sum+=(i%2?4:2)*sigma(i*h);length=sum*h/3;
let x=info(u,R,a,m,n,beta),pt=project(x.r);ctx.fillStyle='#f6f1ff';ctx.beginPath();ctx.arc(...pt,7,0,tau);ctx.fill();arrow(ctx,x.r,x.B.map(z=>z/x.kB),.003);
el('length').textContent=(length*1000).toFixed(3)+' mm';el('period').textContent=(length/(beta*c)*1e9).toFixed(5)+' ns';el('curvature').textContent=x.k.toFixed(3)+' 1/m';el('magnetic').textContent=x.kB.toFixed(4)+' T';el('closed').textContent=`是 (${m/g},${n/g})`;
}
for(let id of ids)el(id).addEventListener('input',render);
el('reset').addEventListener('click',()=>{Object.entries({major:10,minor:2,m:2,n:3,beta:.8,phase:1.1}).forEach(([id,val])=>el(id).value=val);render()});
el('play').addEventListener('click',()=>{running=!running;el('play').textContent=running?'暂停动画':'继续动画'});
let last=0;function animate(t){if(running&&t-last>30){el('phase').value=($('phase')+.02)%(tau);render();last=t}raf=requestAnimationFrame(animate)}render();raf=requestAnimationFrame(animate);
</script></body></html>
