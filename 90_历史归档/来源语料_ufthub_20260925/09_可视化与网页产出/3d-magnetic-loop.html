<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>磁场正负闭环 — N极出 S极入</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%230a0e1a'/%3E%3Cpath d='M32 16 Q48 24 32 32 Q16 40 32 48' stroke='%23f59e0b' stroke-width='3' fill='none'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fbbf24'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020408;
    color: #e5e7eb;
    font-family: 'Noto Sans SC', sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  .overlay { position: fixed; pointer-events: none; z-index: 10; }
  .top-bar {
    top: 0; left: 0; right: 0;
    padding: 18px 32px;
    background: linear-gradient(to bottom, rgba(2,4,8,0.95), transparent);
  }
  .top-bar h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.35em;
    font-weight: 700;
    background: linear-gradient(135deg, #fbbf24, #f97316);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .top-bar .subtitle {
    color: #9ca3af;
    font-size: 0.8em;
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
  }
  .pole-label {
    position: fixed;
    z-index: 20;
    pointer-events: none;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    padding: 4px 12px;
    border-radius: 4px;
  }
  .pole-n {
    color: #fef08a;
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid rgba(239, 68, 68, 0.5);
    text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
  }
  .pole-s {
    color: #93c5fd;
    background: rgba(59, 130, 246, 0.2);
    border: 1px solid rgba(59, 130, 246, 0.5);
    text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
  }
  .control-panel {
    top: 90px; left: 20px;
    width: 240px;
    background: rgba(10, 14, 25, 0.88);
    border: 1px solid rgba(245, 158, 11, 0.25);
    border-radius: 10px;
    padding: 16px;
    backdrop-filter: blur(12px);
    pointer-events: auto;
  }
  .control-panel h3 {
    color: #fbbf24; font-size: 0.85em; margin-bottom: 12px;
    font-weight: 600; letter-spacing: 0.5px;
  }
  .control-group { margin-bottom: 12px; }
  .control-group label {
    display: flex; justify-content: space-between;
    color: #9ca3af; font-size: 0.75em; margin-bottom: 5px;
    font-family: 'JetBrains Mono', monospace;
  }
  .control-group label .val { color: #fbbf24; font-weight: 500; }
  .control-group input[type="range"] {
    width: 100%; height: 4px;
    background: rgba(245, 158, 11, 0.2);
    border-radius: 2px; outline: none; -webkit-appearance: none;
  }
  .control-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    background: #f59e0b; border-radius: 50%; cursor: pointer;
  }
  .info-panel {
    top: 90px; right: 20px;
    width: 260px;
    background: rgba(10, 14, 25, 0.88);
    border: 1px solid rgba(245, 158, 11, 0.25);
    border-radius: 10px;
    padding: 16px;
    backdrop-filter: blur(12px);
  }
  .info-panel h3 {
    color: #fbbf24; font-size: 0.85em; margin-bottom: 10px; font-weight: 600;
  }
  .info-row {
    display: flex; justify-content: space-between;
    padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 0.78em;
  }
  .info-row .key { color: #9ca3af; font-family: 'JetBrains Mono', monospace; }
  .info-row .val { color: #e5e7eb; font-family: 'JetBrains Mono', monospace; }
  .legend {
    bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(10, 14, 25, 0.88);
    border: 1px solid rgba(245, 158, 11, 0.25);
    border-radius: 10px;
    padding: 12px 18px;
    backdrop-filter: blur(12px);
    display: flex; gap: 20px; align-items: center;
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 0.75em; color: #9ca3af;
  }
  .legend-n {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ef4444; box-shadow: 0 0 8px #ef4444;
  }
  .legend-s {
    width: 10px; height: 10px; border-radius: 50%;
    background: #3b82f6; box-shadow: 0 0 8px #3b82f6;
  }
  .legend-flow {
    width: 18px; height: 3px;
    background: linear-gradient(to right, #ef4444, #f59e0b, #3b82f6);
    border-radius: 2px;
  }
  .toggle-btn {
    pointer-events: auto;
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: #fbbf24; padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 0.75em; margin-top: 8px; width: 100%;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .toggle-btn:hover { background: rgba(245, 158, 11, 0.25); }
  @media (max-width: 768px) {
    .control-panel, .info-panel { width: calc(100% - 40px); left: 20px; right: 20px; }
    .info-panel { top: auto; bottom: 90px; }
    .legend { bottom: 16px; flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="overlay top-bar">
  <h1>磁场正负闭环螺旋 — N极出 · S极入</h1>
  <div class="subtitle">Magnetic Dipole Spiral Closed-Loop | 磁力线从N极流出，螺旋环绕，回归S极</div>
</div>

<div class="overlay control-panel">
  <h3>参数控制</h3>
  <div class="control-group">
    <label>磁极间距 d <span class="val" id="val-d">2.0</span></label>
    <input type="range" id="slider-d" min="1.0" max="4.0" step="0.1" value="2.0">
  </div>
  <div class="control-group">
    <label>螺旋半径 a <span class="val" id="val-a">1.2</span></label>
    <input type="range" id="slider-a" min="0.5" max="2.5" step="0.1" value="1.2">
  </div>
  <div class="control-group">
    <label>螺旋匝数 <span class="val" id="val-turns">3</span></label>
    <input type="range" id="slider-turns" min="1" max="6" step="1" value="3">
  </div>
  <div class="control-group">
    <label>粒子流速 <span class="val" id="val-flow">1.5</span></label>
    <input type="range" id="slider-flow" min="0.2" max="4.0" step="0.1" value="1.5">
  </div>
  <div class="control-group">
    <label>磁感线亮度 <span class="val" id="val-bright">2.0</span></label>
    <input type="range" id="slider-bright" min="0.5" max="3.0" step="0.1" value="2.0">
  </div>
  <button class="toggle-btn" id="btn-toggle-anim">暂停动画</button>
</div>

<div class="overlay info-panel">
  <h3>磁场闭环参数</h3>
  <div class="info-row"><span class="key">N极位置</span><span class="val" style="color:#ef4444">z = +d/2</span></div>
  <div class="info-row"><span class="key">S极位置</span><span class="val" style="color:#3b82f6">z = -d/2</span></div>
  <div class="info-row"><span class="key">磁感线方向</span><span class="val" style="color:#fbbf24">N → S（外部）</span></div>
  <div class="info-row"><span class="key">闭环条件</span><span class="val" style="color:#34d399">闭合 ✓</span></div>
  <div class="info-row"><span class="key">螺旋角速度 ω</span><span class="val" id="info-omega">1.50 rad/s</span></div>
  <div class="info-row"><span class="key">极向流速 v</span><span class="val" style="color:#fbbf24">≈ c ✓</span></div>
</div>

<div class="overlay legend">
  <div class="legend-item"><div class="legend-n"></div><span>N极（流出）</span></div>
  <div class="legend-item"><div class="legend-flow"></div><span>磁感线（N→S）</span></div>
  <div class="legend-item"><div class="legend-s"></div><span>S极（流入）</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ========== 场景 ==========
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020408);
scene.fog = new THREE.FogExp2(0x020408, 0.01);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6, 4, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

// Bloom 辉光
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.9, 0.5, 0.8
);
composer.addPass(bloomPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 25;
controls.target.set(0, 0, 0);

// 光照
scene.add(new THREE.AmbientLight(0x2a2a40, 0.6));
const nLight = new THREE.PointLight(0xef4444, 3, 8);
const sLight = new THREE.PointLight(0x3b82f6, 3, 8);
scene.add(nLight, sLight);

// ========== 参数 ==========
let params = {
  d: 2.0,       // 磁极间距
  a: 1.2,       // 螺旋最大半径
  turns: 3,     // 螺旋匝数
  flowSpeed: 1.5,
  brightness: 2.0
};
let animating = true;
let time = 0;

// ========== N极 和 S极 ==========
let nPole, sPole, nGlow, sGlow;

function buildPoles() {
  // 清理旧的
  if (nPole) {
    scene.remove(nPole, sPole, nGlow, sGlow);
    nPole.geometry.dispose(); nPole.material.dispose();
    sPole.geometry.dispose(); sPole.material.dispose();
    nGlow.geometry.dispose(); nGlow.material.dispose();
    sGlow.geometry.dispose(); sGlow.material.dispose();
  }

  const poleRadius = 0.18;
  const halfD = params.d / 2;

  // N极（上端，红色）
  nPole = new THREE.Mesh(
    new THREE.SphereGeometry(poleRadius, 24, 24),
    new THREE.MeshStandardMaterial({
      color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 1.5,
      roughness: 0.3, metalness: 0.5
    })
  );
  nPole.position.set(0, halfD, 0);
  scene.add(nPole);

  nGlow = new THREE.Mesh(
    new THREE.SphereGeometry(poleRadius * 2, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.15, side: THREE.BackSide })
  );
  nGlow.position.copy(nPole.position);
  scene.add(nGlow);

  // S极（下端，蓝色）
  sPole = new THREE.Mesh(
    new THREE.SphereGeometry(poleRadius, 24, 24),
    new THREE.MeshStandardMaterial({
      color: 0x3b82f6, emissive: 0x3b82f6, emissiveIntensity: 1.5,
      roughness: 0.3, metalness: 0.5
    })
  );
  sPole.position.set(0, -halfD, 0);
  scene.add(sPole);

  sGlow = new THREE.Mesh(
    new THREE.SphereGeometry(poleRadius * 2, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.15, side: THREE.BackSide })
  );
  sGlow.position.copy(sPole.position);
  scene.add(sGlow);

  nLight.position.set(0, halfD, 0);
  sLight.position.set(0, -halfD, 0);
}

buildPoles();

// ========== 螺旋闭环磁感线 ==========
// 从N极出发，螺旋向外扩散，再螺旋收回S极
let fieldLines = [];
let particleSystems = [];

// 计算单条螺旋磁感线上的点（从N极到S极）
function getFieldLinePoint(t, angleOffset, rMaxInput) {
  // t: 0 → 1，从N极到S极
  const halfD = params.d / 2;
  const turns = params.turns;
  const rMax = rMaxInput || params.a;

  // 半径先增大后减小（磁偶极子场线形状）
  const envelope = Math.sin(Math.PI * t); // 0→1→0
  const r = rMax * envelope;

  // 角度：随t线性变化（螺旋）
  const angle = angleOffset + t * turns * Math.PI * 2;

  // y坐标：从N极到S极线性变化
  const y = halfD - t * params.d;

  return new THREE.Vector3(
    r * Math.cos(angle),
    y,
    r * Math.sin(angle)
  );
}

// 磁感线颜色：N极端红，中间黄，S极端蓝
function getFieldLineColor(t) {
  // t: 0(N极) → 0.5(中间) → 1(S极)
  const cN = new THREE.Color(0xef4444);    // 红
  const cMid = new THREE.Color(0xfbbf24); // 黄
  const cS = new THREE.Color(0x3b82f6);   // 蓝

  if (t < 0.5) {
    return cN.lerp(cMid, t * 2);
  } else {
    return cMid.lerp(cS, (t - 0.5) * 2);
  }
}

function buildFieldLines() {
  // 清理旧的
  fieldLines.forEach(l => { scene.remove(l); l.geometry.dispose(); l.material.dispose(); });
  fieldLines = [];
  particleSystems.forEach(p => { scene.remove(p); p.geometry.dispose(); p.material.dispose(); });
  particleSystems = [];

  const numLines = 12; // 磁感线条数
  const pointsPerLine = 200;

  for (let line = 0; line < numLines; line++) {
    const angleOffset = (line * Math.PI * 2) / numLines;
    // 不同半径的磁感线（模拟偶极子场的不同通量管）
    const rMax = params.a * (0.4 + 0.6 * (line / numLines));

    const points = [];
    const colors = [];

    for (let i = 0; i <= pointsPerLine; i++) {
      const t = i / pointsPerLine;
      const p = getFieldLinePoint(t, angleOffset, rMax);
      points.push(p);
      const c = getFieldLineColor(t);
      colors.push(c.r, c.g, c.b);
    }

    const geo = new THREE.BufferGeometry().setFromPoints(points);
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const mat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: Math.min(1, params.brightness * 0.3 + 0.3),
      blending: THREE.AdditiveBlending
    });
    const lineObj = new THREE.Line(geo, mat);
    scene.add(lineObj);
    fieldLines.push(lineObj);

    // 每条磁感线上加粒子
    const numParticles = 25;
    const pPositions = new Float32Array(numParticles * 3);
    const particleT = [];

    for (let i = 0; i < numParticles; i++) {
      const t = i / numParticles;
      const p = getFieldLinePoint(t, angleOffset, rMax);
      pPositions[i * 3] = p.x;
      pPositions[i * 3 + 1] = p.y;
      pPositions[i * 3 + 2] = p.z;
      particleT.push(t);
    }

    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

    // 粒子颜色：根据位置渐变
    const pColors = new Float32Array(numParticles * 3);
    for (let i = 0; i < numParticles; i++) {
      const c = getFieldLineColor(particleT[i]);
      pColors[i * 3] = c.r;
      pColors[i * 3 + 1] = c.g;
      pColors[i * 3 + 2] = c.b;
    }
    pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

    const pMat = new THREE.PointsMaterial({
      size: 0.05,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true
    });

    const pointsObj = new THREE.Points(pGeo, pMat);
    pointsObj.userData = { particleT, angleOffset, rMax };
    scene.add(pointsObj);
    particleSystems.push(pointsObj);
  }
}

buildFieldLines();

// ========== 控制面板 ==========
document.getElementById('slider-d').addEventListener('input', e => {
  params.d = parseFloat(e.target.value);
  document.getElementById('val-d').textContent = params.d.toFixed(1);
  buildPoles();
  buildFieldLines();
});
document.getElementById('slider-a').addEventListener('input', e => {
  params.a = parseFloat(e.target.value);
  document.getElementById('val-a').textContent = params.a.toFixed(1);
  buildFieldLines();
});
document.getElementById('slider-turns').addEventListener('input', e => {
  params.turns = parseInt(e.target.value);
  document.getElementById('val-turns').textContent = params.turns;
  buildFieldLines();
});
document.getElementById('slider-flow').addEventListener('input', e => {
  params.flowSpeed = parseFloat(e.target.value);
  document.getElementById('val-flow').textContent = params.flowSpeed.toFixed(1);
});
document.getElementById('slider-bright').addEventListener('input', e => {
  params.brightness = parseFloat(e.target.value);
  document.getElementById('val-bright').textContent = params.brightness.toFixed(1);
  fieldLines.forEach(l => {
    l.material.opacity = Math.min(1, params.brightness * 0.3 + 0.3);
  });
});
document.getElementById('btn-toggle-anim').addEventListener('click', () => {
  animating = !animating;
  document.getElementById('btn-toggle-anim').textContent = animating ? '暂停动画' : '播放动画';
});

// ========== 动画循环 ==========
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (animating) {
    time += delta;

    // 粒子沿磁感线流动（从N极 → S极）
    particleSystems.forEach(ps => {
      const posAttr = ps.geometry.attributes.position;
      const data = ps.userData.particleT;
      const offset = ps.userData.angleOffset;
      const rMax = ps.userData.rMax;

      for (let i = 0; i < data.length; i++) {
        data[i] += delta * params.flowSpeed * 0.15;
        if (data[i] > 1) data[i] -= 1; // 闭环：从S极回到N极（内部）
        const p = getFieldLinePoint(data[i], offset, rMax);
        posAttr.setXYZ(i, p.x, p.y, p.z);
      }
      posAttr.needsUpdate = true;

      // 更新粒子颜色
      const colorAttr = ps.geometry.attributes.color;
      for (let i = 0; i < data.length; i++) {
        const c = getFieldLineColor(data[i]);
        colorAttr.setXYZ(i, c.r, c.g, c.b);
      }
      colorAttr.needsUpdate = true;
    });

    // N极和S极脉动
    const pulseN = 1 + Math.sin(time * 3) * 0.1;
    const pulseS = 1 + Math.sin(time * 3 + Math.PI) * 0.1;
    nPole.scale.setScalar(pulseN);
    sPole.scale.setScalar(pulseS);
    nGlow.scale.setScalar(pulseN * 1.2);
    sGlow.scale.setScalar(pulseS * 1.2);
    nGlow.material.opacity = 0.12 + Math.sin(time * 3) * 0.06;
    sGlow.material.opacity = 0.12 + Math.sin(time * 3 + Math.PI) * 0.06;
  }

  controls.update();
  composer.render();
}

animate();

// ========== 自适应 ==========
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
