<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>§29 复活定律与可检验 κ 带：PQ/R 对称抑制机制参数空间</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #chart { width: 986px; height: 420px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
(function(){
  var el = document.getElementById('chart');
  if (!el || typeof echarts === 'undefined') { return; }
  var chart = echarts.init(el);
  var opt = {
    title: { text: '§29 复活定律与可检验 κ 带（M_Hc_eff·M_S = 3.57×10²¹ GeV²）', left: 'center', top: 6, textStyle: { fontSize: 15 } },
    tooltip: {
      trigger: 'axis', triggerOn: 'mousemove|click', renderMode: 'richText', confine: true,
      formatter: function(ps){
        if (!ps || !ps.length) { return ''; }
        var p = ps[0];
        var s = 'M_S = ' + p.value[0] + ' TeV' + String.fromCharCode(10);
        if (p.data && p.data.k) { s += 'κ 可检验带 [' + p.data.k + ']'; }
        return s;
      }
    },
    legend: { top: 30, textStyle: { fontSize: 11 } },
    grid: { left: 110, right: 50, top: 72, bottom: 55, containLabel: true },
    xAxis: { type: 'log', name: 'M_S (TeV)', min: 1, max: 1000,
      axisLabel: { fontSize: 11 }, nameTextStyle: { fontSize: 11 } },
    yAxis: { type: 'log', name: 'κ（有效色三重态质量放大因子）', min: 1e-3, max: 1e5,
      axisLabel: { fontSize: 11, formatter: function(v){ var e = Math.floor(Math.log10(v)); return '10' + e; } },
      nameTextStyle: { fontSize: 11 } },
    series: [
      {
        name: '复活边界 κ*(Super-K)', type: 'line', symbol: 'circle', symbolSize: 7, lineStyle: { width: 2 },
        data: [{ value: [1, 3.2e3] }, { value: [10, 3.83e1] }, { value: [100, 4.65e-1] }, { value: [1000, 5.74e-3] }]
      },
      {
        name: '可检验上界 κ_HK(Hyper-K)', type: 'line', symbol: 'circle', symbolSize: 6,
        lineStyle: { type: 'dashed', width: 2 },
        data: [{ value: [1, 1.25e4] }, { value: [10, 1.49e2] }, { value: [100, 1.81] }, { value: [1000, 2.23e-2] }]
      },
      {
        name: '复活→可检验条带', type: 'line', symbol: 'none', lineStyle: { opacity: 0 }, stack: 'band',
        data: [[1, 3.2e3], [10, 3.83e1], [100, 4.65e-1], [1000, 5.74e-3]],
        areaStyle: { color: 'rgba(120,180,255,0.22)' }
      },
      {
        name: '§28 无抑制窗口', type: 'scatter', symbol: 'diamond', symbolSize: 8,
        data: [{ value: [67, 1.0], k: '§28 窄带 [67,132]TeV 位于 κ=1' }]
      },
      {
        name: 'R 对称（dim-5 完全禁止）', type: 'line', symbol: 'none', lineStyle: { type: 'dotted', width: 1.5, color: '#999' },
        markLine: {
          symbol: 'none', silent: true,
          data: [{ xAxis: 1000, label: { formatter: 'R 对称: κ→∞, τ=τ₆ 不可检验', position: 'insideEndBottom', fontSize: 11 } }]
        },
        data: [[1, 1e5], [1000, 1e5]]
      }
    ]
  };
  chart.setOption(opt);
  window.addEventListener('resize', function(){ if (chart) { chart.resize(); } });
})();
</script>
</body>
</html>
