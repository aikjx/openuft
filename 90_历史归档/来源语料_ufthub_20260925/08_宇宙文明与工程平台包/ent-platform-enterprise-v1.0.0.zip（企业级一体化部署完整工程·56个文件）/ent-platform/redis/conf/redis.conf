# =============================================================================
# Redis 7.x 企业级最优默认配置 (容器内 /etc/redis/redis.conf)
# 密码不在本文件, 由 compose 启动参数 --requirepass 注入
# =============================================================================

# ---------- 网络 ----------
bind 0.0.0.0
protected-mode yes
port 6379
timeout 300
tcp-keepalive 60
tcp-backlog 511

# ---------- 通用 ----------
daemonize no
supervised no
databases 16
always-show-logo no
loglevel notice
# 日志输出到 stdout, docker logs 直接可见
logfile ""

# ---------- 内存 (混合场景: 缓存 + 任务队列) ----------
# 最优值: 容器/机器可用内存的 60%~70%; tune-memory.sh 可自动生成
maxmemory 512mb
# 队列(List/Stream)要求不丢任务时, 队列库请单独用 noeviction;
# 这里整体做缓存+队列, 选 volatile-lru: 只淘汰设了 TTL 的 key, 队列永不被淘汰
maxmemory-policy volatile-lru
maxmemory-samples 5

# ---------- 持久化: AOF 为主 (每秒刷盘, 性能与安全平衡) ----------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# RDB 兜底快照
save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb
dir /data

# ---------- 慢日志 ----------
slowlog-log-slower-than 10000   # 10ms
slowlog-max-len 128

# ---------- 客户端缓冲 (自动化批量任务防撑爆) ----------
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ---------- 惰性删除/主动过期 ----------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
