<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>§26 质子衰变可检验窗口：τ(p→e⁺π⁰) vs M_X</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #chart { width: 986px; height: 420px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
(function(){
  var el = document.getElementById('chart');
  if (!el || typeof echarts === 'undefined') { return; }
  var chart = echarts.init(el);
  function fmt(v){ return v >= 1e35 ? (v/1e35).toFixed(2) + 'e35' : (v/1e34).toFixed(2) + 'e34'; }
  var xs = [5.7, 6.0, 7.0, 8.0, 9.0, 10.0, 12.0, 13.41, 16.0, 19.0];
  var line = xs.map(function(x){ return [x, 5.0e34 * Math.pow(x/8.0, 4)]; });
  var option = {
    title: { text: '质子衰变可检验窗口：§25 能标 M_X=1.34×10¹⁶ GeV → τ=3.9×10³⁵ yr', left: 'center', top: 6, textStyle: { fontSize: 15 } },
    tooltip: {
      trigger: 'axis',
      triggerOn: 'mousemove|click',
      renderMode: 'richText',
      confine: true,
      formatter: function(params){
        if (!params || !params.length) { return ''; }
        var p = params[0];
        var s = 'M_X = ' + Number(p.value[0]).toFixed(3) + '×10¹⁶ GeV' + String.fromCharCode(10)
              + 'τ(p→e⁺π⁰) = ' + Number(p.value[1]).toExponential(2) + ' yr';
        if (p.seriesType === 'scatter') { s += String.fromCharCode(10) + p.data.label; }
        return s;
      }
    },
    legend: { top: 30, textStyle: { fontSize: 11 } },
    grid: { left: 85, right: 40, top: 70, bottom: 55, containLabel: true },
    xAxis: { type: 'log', name: 'M_X (10¹⁶ GeV)', min: 0.55, max: 2.0, axisLabel: { fontSize: 11, formatter: function(v){ return Number(v).toFixed(1); } }, nameTextStyle: { fontSize: 11 } },
    yAxis: { type: 'log', name: 'τ(p→e⁺π⁰) (yr)', min: 1.0e33, max: 1.0e37, axisLabel: { fontSize: 11, formatter: function(v){ return fmt(v); } }, nameTextStyle: { fontSize: 11 } },
    series: [
      {
        name: 'τ ∝ M_X⁴（dim-6）', type: 'line',
        data: line.map(function(d){ return { value: d }; }),
        symbol: 'none', lineStyle: { width: 2 },
        markLine: {
          symbol: 'none', silent: true,
          lineStyle: { type: 'dashed', width: 1.5 },
          label: { fontSize: 11 },
          data: [
            { yAxis: 1.29e34, lineStyle: { type: 'dashed' }, label: { formatter: 'Super-K 界 1.29×10³⁴ yr', position: 'insideEndTop' } },
            { yAxis: 1.0e35, lineStyle: { type: 'dotted' }, label: { formatter: 'Hyper-K 灵敏度 ~10³⁵ yr', position: 'insideEndTop' } }
          ]
        }
      },
      {
        name: '关键点', type: 'scatter', symbolSize: 8,
        data: [
          { value: [0.8, 5.0e34], label: '1304.0343 锚点 M_X=0.8×10¹⁶' },
          { value: [1.341, 3.95e35], label: '§25 全链 M_X=M_GUT=1.341×10¹⁶' },
          { value: [1.9, 1.59e36], label: '文献低能参考 M_GUT=1.9×10¹⁶' }
        ]
      }
    ]
  };
  chart.setOption(option);
  window.addEventListener('resize', function(){ if (chart) { chart.resize(); } });
})();
</script>
</body>
</html>
