# =============================================================================
# 企业级一体化平台 —— Docker Compose 主编排文件
# 组件: Nginx(接入) + Java Backend(应用) + MySQL + Redis
#       + Python Worker(RPA/IP任务) + Headless Chromium(浏览器) + OCR 服务
# 原则:
#   1) 所有有状态数据一律 bind mount 到 ./data，便于备份、迁移、信创离线交付
#   2) 中间件端口只绑定 127.0.0.1，外部只能经 Nginx 接入
#   3) 两个网络: edge(接入区) / core(核心区)，OCR/浏览器/数据库不直接对外
#   4) 统一日志轮转，避免磁盘打满
# 用法:
#   cp .env.example .env  (install 脚本会自动完成)
#   docker compose up -d
#   GPU OCR: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# =============================================================================

name: ent-platform

# ------------------------------------------------------------------ 公共锚点
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-restart: &restart
  restart: unless-stopped

# ------------------------------------------------------------------ 网络规划
networks:
  edge:   # 接入网络: 只有 nginx 暴露宿主机端口
    name: ent-edge
  core:   # 核心网络: 应用/中间件/自动化服务内部互通
    name: ent-core
    internal: false   # Worker 需访问外网页面, 因此不设为纯内网; 安全靠端口不暴露

services:
  # ============================================================== MySQL ===
  mysql:
    image: mysql:${MYSQL_TAG:-8.0}
    container_name: ent-mysql
    <<: *restart
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./backup:/backup:ro
    networks: [core]
    ports:
      # 仅本机可连; 如需远程调试改成 0.0.0.0 并配合防火墙/安全组
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  # ============================================================== Redis ===
  redis:
    image: redis:${REDIS_TAG:-7.2}
    container_name: ent-redis
    <<: *restart
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    # 密码通过启动参数注入, 避免把密码写死在 redis.conf
    command:
      - sh
      - -c
      - 'exec redis-server /etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - ./data/redis:/data
      - ./redis/conf/redis.conf:/etc/redis/redis.conf:ro
    networks: [core]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ============================================================== Nginx ===
  nginx:
    image: nginx:${NGINX_TAG:-1.27}
    container_name: ent-nginx
    <<: *restart
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
      - ./data/static:/usr/share/nginx/static:ro
    networks: [edge, core]
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"   # 配好证书后在 nginx/conf.d 中开启
    # 不 depends_on backend: backend 为可选 profile, nginx 通过 Docker DNS 惰性解析

  # ====================================================== Java 后端 ========
  # 默认 profile: 只有检测到 backend/app.jar 时 install 脚本才会带 --profile backend
  # 没有业务 jar 时, 整套中间件+自动化服务照常运行, 不影响一键体验
  backend:
    profiles: ["backend"]
    build:
      context: ./backend
    image: ent/backend:${BACKEND_VERSION:-latest}
    container_name: ent-backend
    <<: *restart
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES:-prod}
      # 业务通过服务名访问中间件 (容器网络内)
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./logs/backend:/app/logs
      - ./data/uploads:/app/uploads
    networks: [core]
    expose: ["8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo ok >&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ====================================================== OCR 识别服务 =====
  # OCR_ENGINE:
  #   paddle = 飞桨 PaddleOCR (x86_64 精度/生态最佳, GPU 可加速)
  #   rapid  = RapidOCR(ONNX Runtime, 跨 amd64/arm64, 信创 ARM CPU 默认, 轻量)
  ocr:
    build:
      context: ./ocr
      args:
        OCR_ENGINE: ${OCR_ENGINE:-paddle}
        PYTHON_TAG: ${PYTHON_TAG:-3.10-slim}
    image: ent/ocr:${OCR_ENGINE:-paddle}
    container_name: ent-ocr
    <<: *restart
    logging: *default-logging
    shm_size: 1g
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
      OCR_LANG: ${OCR_LANG:-ch}
      OCR_WORKERS: ${OCR_WORKERS:-1}
    volumes:
      - ./data/shared:/data
      # PaddleOCR 默认模型目录, 持久化避免重建容器重下模型
      - ./data/ocr-models:/root/.paddleocr
    networks: [core]
    expose: ["8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 90s   # 首次加载模型较慢

  # ============================================ Headless 浏览器服务 ========
  # 常驻一个 Chromium, 通过 CDP(9222) 供 Worker 远程连接, 避免反复启动浏览器
  browser:
    build:
      context: ./browser
      args:
        PLAYWRIGHT_TAG: ${PLAYWRIGHT_TAG:-v1.48.0-jammy}
    image: ent/browser:${PLAYWRIGHT_TAG:-v1.48.0-jammy}
    container_name: ent-browser
    <<: *restart
    logging: *default-logging
    shm_size: 2g   # Chromium 必须给够 /dev/shm, 否则页面崩溃
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    networks: [core]
    expose: ["9222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9222/json/version >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ====================================== Python 自动化 Worker (RPA/IP任务)
  worker:
    build:
      context: ./worker
      args:
        PYTHON_TAG: ${PYTHON_TAG:-3.10-slim}
    image: ent/worker:${WORKER_VERSION:-latest}
    container_name: ent-worker
    <<: *restart
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 容器网络内用服务名互访
      BROWSER_CDP: http://browser:9222
      OCR_URL: http://ocr:8000/ocr
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TASK_QUEUE: ${TASK_QUEUE:-rpa:tasks}
      RESULT_QUEUE: ${RESULT_QUEUE:-rpa:results}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 出口代理(IP任务): 留空则直连; 支持 http://user:pass@host:port
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      PAGE_TIMEOUT: ${PAGE_TIMEOUT:-60000}
    volumes:
      - ./data/shared:/data
      - ./logs/worker:/app/logs
    networks: [core]
    depends_on:
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }
      browser: { condition: service_started }
      ocr: { condition: service_started }
