N_f/3、β₁=102−38N_f/3", "d": "两圈 QCD 系数取文献口径（d/dlnμ² 约定；N_f=3 对照 β₀=9、β₁=64 ✓ C1）。未联网核对承本线惯例（B 边界）；一般 SU(N_c) 两圈系数的本卷口径扫描登记为X-R311-2（Caswell 型系数的约定差异需先统一）。"}, {"id": "Q10", "v": "INFO", "t": "总判词", "d": "MIN-CONTENT → SELECTION-PROTOTYPE → PARAMETER-LEDGER：判词链第 5 层完成。α 第一性预测的充要目标已在记账表中以 |P_cont|=0 + 电磁侧 + 内容相容 三条件形式化。"}, {"id": "C1", "v": "PASS", "t": "QCD N_f=3：β₀=9、β₁=64（文献值 9/64）", "d": "β₀=(33−6)/3=9 ✓；β₁=(306−114)/3=64 ✓——口径与文献一致。"}, {"id": "C2", "v": "PASS", "t": "QED 一圈固定点集 = {0}：固定点判据必须拒绝 QED 出现非平凡选择", "d": "sympy 解集 [0]——无正固定点（承 r304 Q7），判据正确拒绝 QED 侧的「选择原型」资格。"}, {"id": "C3", "v": "PASS", "t": "SU(5) 5̄ 通道：tr(Y_GUT²)=1/2=T(5̄)", "d": "tr=1/2 ✓（承 Q4）。"}, {"id": "C4", "v": "PASS", "t": "N_f=5（β₁=116/3>0）：必须不产生红外固定点（固定点判据有牙）", "d": "β₁>0 ⇒ α*=−4πβ₀/β₁<0 非物理 ⇒ 正确拒绝；窗口判据 N_f>8.053 有效。"}, {"id": "G1", "v": "PASS", "t": "Decimal 精度 ≥ 70 位", "d": "prec=80"}, {"id": "G3", "v": "PASS", "t": "窗口下缘 = 8.0526…（精确 306/38）", "d": "nf_lo=8.052632"}, {"id": "G4", "v": "PASS", "t": "微扰可信固定点 ≥ 2（N_f=15,16）", "d": "n_pert=4"}, {"id": "G5", "v": "PASS", "t": "α*(N_f=16) ∈ (0.03, 0.1)", "d": "α*=0.04161"}, {"id": "G6", "v": "PASS", "t": "判据牙齿齐备：控制组 ≥4 且拒绝型负对照 C2/C4 PASS（主条目 FAIL 计数如实登记，本卷=0）", "d": "控制组 4；C2/C4 PASS（承 r300/r301 G6 语义）。"}, {"id": "G7", "v": "PASS", "t": "关键量正（窗口宽度、5/3 因子）", "d": "窗口宽 8.447"}, {"id": "G8", "v": "PASS", "t": "条目键集合一致", "d": "6 键"}, {"id": "G9", "v": "PASS", "t": "仅写本卷路径（不触碰他卷字节）", "d": "写入 0 个路径，越界 0 个"}, {"id": "G10", "v": "PASS", "t": "verdict 取值合法", "d": "∈ {PASS,FAIL,BOUNDARY,INFO}"}, {"id": "G2", "v": "PASS", "t": "条目计数一致（声明 24 = 实收 24）", "d": "主条目 10 + 控制组 4 + 守卫 10 = 24，实收 24 条"}], "bz": [[9, 5.235987755982989], [10, 2.207605648468503], [11, 1.2341971139102756], [12, 0.7539822368615503], [13, 0.46789677819422454], [14, 0.2780170489902472], [15, 0.14279966607226333], [16, 0.041610498723043614]]};
